<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Susurros del viento | Arte y Productos Artesanales</title>
    <link rel="icon" href="assets/img/logooo.ico">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="root"></div>

    <!-- React y Babel desde CDN (no hay que instalar ni compilar nada) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>

    <!-- Datos y utilidades (JavaScript normal) -->
    <script src="assets/js/react/datos.js"></script>
    <script src="assets/js/react/utilidades.js"></script>

    <!-- Componentes (JSX). El ORDEN importa: app.jsx va de último -->
    <script type="text/babel" data-presets="react" src="assets/js/react/contextos.jsx"></script>
    <script type="text/babel" data-presets="react" src="assets/js/react/componentes.jsx"></script>
    <script type="text/babel" data-presets="react" src="assets/js/react/paginas.jsx"></script>
    <script type="text/babel" data-presets="react" src="assets/js/react/app.jsx"></script>
</body>
</html>
